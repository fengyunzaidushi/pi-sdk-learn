<section id="learning-assessment-answer-card" aria-labelledby="learning-assessment-title">
  <style>
    #learning-assessment-answer-card {
      color: var(--foreground);
      width: 100%;
    }

    #learning-assessment-answer-card .answer-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    #learning-assessment-answer-card .answer-layout {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-top: 14px;
    }

    #learning-assessment-answer-card .question-number {
      width: 4rem;
      white-space: nowrap;
      font-weight: 500;
    }

    #learning-assessment-answer-card .option-cell {
      text-align: center;
    }

    #learning-assessment-answer-card .answer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    @media (max-width: 560px) {
      #learning-assessment-answer-card .answer-layout {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>

  <div class="answer-header">
    <h2 id="learning-assessment-title">学习测验答题卡</h2>
    <span id="learning-assessment-count" class="text-muted tabular-nums">已作答 0/0</span>
  </div>

  <div
    id="learning-assessment-progress"
    class="progress"
    role="progressbar"
    aria-label="答题进度"
    aria-valuenow="0"
    aria-valuemin="0"
    aria-valuemax="0"
  >
    <div id="learning-assessment-progress-bar" class="progress-bar" style="width: 0%"></div>
  </div>

  <div id="learning-assessment-layout" class="answer-layout"></div>

  <div class="answer-actions">
    <span id="learning-assessment-status" class="text-muted" aria-live="polite">每题选择一个答案</span>
    <button id="learning-assessment-submit" class="btn btn-primary" type="button" disabled>
      <i data-lucide="send" aria-hidden="true"></i>
      提交答卷
    </button>
  </div>

  <script>
    (() => {
      const title = __TITLE_JSON__;
      const totalQuestions = __QUESTION_COUNT__;
      const options = __OPTIONS_JSON__;
      const gradingPrompt = __GRADING_PROMPT_JSON__;
      const root = document.getElementById("learning-assessment-answer-card");
      const heading = root.querySelector("#learning-assessment-title");
      const layout = root.querySelector("#learning-assessment-layout");
      const countLabel = root.querySelector("#learning-assessment-count");
      const progress = root.querySelector("#learning-assessment-progress");
      const progressBar = root.querySelector("#learning-assessment-progress-bar");
      const status = root.querySelector("#learning-assessment-status");
      const submitButton = root.querySelector("#learning-assessment-submit");
      let answers = {};

      heading.textContent = title;
      progress.setAttribute("aria-valuemax", String(totalQuestions));

      function extractAnswers(widgetState) {
        const candidate = widgetState?.privateContent?.answers ?? widgetState?.modelContent?.answers;
        if (!candidate || typeof candidate !== "object") return {};

        return Object.fromEntries(
          Object.entries(candidate).filter(([question, option]) => {
            const number = Number(question);
            return Number.isInteger(number) && number >= 1 && number <= totalQuestions && options.includes(option);
          }),
        );
      }

      function createTable(start, end, label) {
        const wrapper = document.createElement("div");
        const table = document.createElement("table");
        table.className = "table table-sm";
        table.setAttribute("aria-label", label);

        const head = document.createElement("thead");
        const headRow = document.createElement("tr");
        const numberHeading = document.createElement("th");
        numberHeading.scope = "col";
        numberHeading.textContent = "题号";
        headRow.appendChild(numberHeading);
        for (const option of options) {
          const optionHeading = document.createElement("th");
          optionHeading.className = "text-center";
          optionHeading.scope = "col";
          optionHeading.textContent = option;
          headRow.appendChild(optionHeading);
        }
        head.appendChild(headRow);
        table.appendChild(head);

        const body = document.createElement("tbody");
        for (let question = start; question <= end; question += 1) {
          const row = document.createElement("tr");
          const numberCell = document.createElement("th");
          numberCell.className = "question-number tabular-nums";
          numberCell.scope = "row";
          numberCell.textContent = `第 ${question} 题`;
          row.appendChild(numberCell);

          for (const option of options) {
            const cell = document.createElement("td");
            cell.className = "option-cell";
            const optionLabel = document.createElement("label");
            optionLabel.className = "form-check";
            optionLabel.setAttribute("aria-label", `第 ${question} 题选择 ${option}`);

            const input = document.createElement("input");
            input.className = "form-check-input";
            input.type = "radio";
            input.name = `question-${question}`;
            input.value = option;
            input.checked = answers[String(question)] === option;

            const hiddenLabel = document.createElement("span");
            hiddenLabel.className = "sr-only";
            hiddenLabel.textContent = option;
            optionLabel.append(input, hiddenLabel);
            cell.appendChild(optionLabel);
            row.appendChild(cell);
          }

          body.appendChild(row);
        }

        table.appendChild(body);
        wrapper.appendChild(table);
        return wrapper;
      }

      function renderTables() {
        const split = Math.ceil(totalQuestions / 2);
        const tables = [createTable(1, split, `第 1 至 ${split} 题`)];
        if (split < totalQuestions) {
          tables.push(createTable(split + 1, totalQuestions, `第 ${split + 1} 至 ${totalQuestions} 题`));
        }
        layout.replaceChildren(...tables);
      }

      function updateProgress() {
        const answered = Object.keys(answers).length;
        const percent = (answered / totalQuestions) * 100;
        countLabel.textContent = `已作答 ${answered}/${totalQuestions}`;
        progress.setAttribute("aria-valuenow", String(answered));
        progressBar.style.width = `${percent}%`;
        submitButton.disabled = answered !== totalQuestions;
        status.textContent = answered === totalQuestions ? "已完成，可以提交" : `还剩 ${totalQuestions - answered} 题`;
      }

      function saveState() {
        const promise = window.openai?.setWidgetState?.({
          modelContent: { answers, answered: Object.keys(answers).length, total: totalQuestions },
          privateContent: { answers },
        });
        promise?.catch(() => {});
      }

      layout.addEventListener("change", (event) => {
        const input = event.target;
        if (!(input instanceof HTMLInputElement) || input.type !== "radio") return;

        const question = input.name.replace("question-", "");
        answers = { ...answers, [question]: input.value };
        updateProgress();
        saveState();
      });

      submitButton.addEventListener("click", async () => {
        if (Object.keys(answers).length !== totalQuestions) return;

        const answerText = Array.from({ length: totalQuestions }, (_, index) => {
          const question = index + 1;
          return `${question}${answers[String(question)]}`;
        }).join(" ");

        if (!window.openai?.sendFollowUpMessage) {
          status.textContent = `请发送答案：${answerText}`;
          return;
        }

        submitButton.disabled = true;
        status.textContent = "正在提交答卷";
        try {
          await window.openai.sendFollowUpMessage({
            title: `提交${title}`,
            prompt: `我的答案：${answerText}\n\n${gradingPrompt}`,
          });
          status.textContent = "答卷已提交";
        } catch {
          submitButton.disabled = false;
          status.textContent = "提交失败，请重试";
        }
      });

      function restoreState(widgetState) {
        answers = extractAnswers(widgetState);
        renderTables();
        updateProgress();
      }

      window.addEventListener("openai:set_globals", (event) => {
        const widgetState = event.detail?.globals?.widgetState;
        if (widgetState) restoreState(widgetState);
      });

      restoreState(window.openai?.widgetState);
    })();
  </script>
</section>
